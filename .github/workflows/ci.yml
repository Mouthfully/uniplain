# The repository's own gate. Everything the kickoff requires before a push -- lint, typecheck,
# unit tests, build -- plus the repository guards.
#
# CI verifies; the platforms deploy. Vercel's Git integration builds apps/web and Cloudflare
# Workers Builds builds each Worker from its own root directory, so there is no deploy job here.
#
# ALL GUARDS ENFORCE. They make the repository's single-source and cross-package invariants
# executable rather than promises in a document, so they fail the build like any other check.
# Four of them have documented escape hatches for cases where the thing they ban is the point:
# `brand-guard-ignore:`, `tokens-guard-ignore:`, `copy-guard-ignore:` and
# `claim-source-guard-ignore:`, on the offending line or the one above it, each requiring a reason.
# Reach for the hatch with a reason, never by widening an exempt list.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version pinned here: pnpm/action-setup reads "packageManager" from package.json,
      # which is the one place the pnpm version is declared.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # cache: pnpm caches the pnpm content-addressable store, keyed on pnpm-lock.yaml.
      # It must come after pnpm is installed -- setup-node shells out to `pnpm store path`.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome lint .

      # Biome has no `--check` flag: bare `biome format` IS the check, exiting non-zero on any
      # file it would reformat. `--write` is the one that changes files.
      - name: Format check
        run: pnpm exec biome format .

      # Per-workspace tsconfigs, deliberately: apps/web needs the DOM lib and apps/api-edge needs
      # @cloudflare/workers-types, and the two collide on fetch/Request/Response/caches.
      - name: Typecheck
        run: pnpm typecheck

      # Every package with tests, not just the Worker. apps/api-edge runs under real workerd via
      # @cloudflare/vitest-pool-workers rather than jsdom, which needs vitest 4.x -- the pool peers
      # ^4.1.0 and vitest 5 breaks it. That pin lives in pnpm-workspace.yaml's catalog and is
      # enforced at install time by strict-peer-dependencies.
      - name: Test
        run: pnpm -r test

      # Both apps, not just the web one. @cloudflare/vitest-pool-workers uses its own transform
      # pipeline rather than wrangler's deploy bundle, so a broken wrangler.jsonc or an esbuild
      # bundling failure passes the test step and only surfaces at deploy. `pnpm -r build` covers
      # apps/web (next build) and apps/api-edge (wrangler deploy --dry-run); packages with no
      # build script are skipped.
      - name: Build
        run: pnpm -r build

      # Every guard runs even when a step above failed, so its output is always visible on the
      # run. `!cancelled()` rather than `always()`: a cancelled run should stop, not carry on.
      - name: Brand guard
        if: ${{ !cancelled() }}
        run: node scripts/check-brand.mjs

      - name: Tokens guard
        if: ${{ !cancelled() }}
        run: node scripts/check-tokens.mjs

      # Brand is intentionally a leaf, so it cannot import connectors to build its source claim.
      # This guard keeps the claim's source mirror equal to directories with a client + normaliser.
      - name: Capability guard
        if: ${{ !cancelled() }}
        run: node scripts/check-capabilities.mjs

      # The dictionary guard. The canonical vocabulary exists twice -- packages/contract as TypeScript,
      # the schema as PostgreSQL enums -- and neither can import the other, so drift between them
      # is invisible until a customer's number goes missing rather than a build going red.
      - name: Dictionary guard
        if: ${{ !cancelled() }}
        run: node scripts/check-dictionary.mjs

      # claim() throws on an unknown or withheld id, but only for text that goes through it. This
      # catches the sentence typed straight into the JSX, which renders like an approved promise and
      # passes every other gate. A heuristic, so it is narrow on purpose -- see the script header.
      - name: Inline-copy guard
        if: ${{ !cancelled() }}
        run: node scripts/check-copy.mjs

      # Every claim cites specification sections and the changelog records which sections override
      # which; nothing cross-checked the two, and `connectors` went on citing 11.9 after 11A.14
      # replaced it. Enforcing within the override's recorded scope, reporting outside it.
      - name: Superseded-citation guard
        if: ${{ !cancelled() }}
        run: node scripts/check-claim-sources.mjs

      # `app.connection_provider` and its TypeScript twin had nothing relating them -- the
      # connections migration says so in a comment and shipped anyway, and four affiliate-network
      # members had already drifted past TypeScript by the time anyone looked. A provider the
      # column cannot store fails on the INSERT, in production, after the customer has finished
      # authorising: the latest possible moment to learn it.
      - name: Provider guard
        if: ${{ !cancelled() }}
        run: node scripts/check-providers.mjs

      # The product's value is that many platforms arrive in ONE vocabulary, and the way that
      # decays is not a decision anybody makes -- it is a connector author, reasonably, using the
      # words their platform used, until the unified store is the union of every vendor's schema
      # with a shared key. The registry is the single place that says where each platform field
      # lands; this makes it binding, and makes a silent drop a build failure.
      - name: Registry guard
        if: ${{ !cancelled() }}
        run: node scripts/check-registry.mjs

      # A SUB-PROCESSOR WAS RECEIVING DATA AND WAS DISCLOSED NOWHERE. `/brief` posted a workspace's
      # figures to openrouter.ai from the day it shipped, while `/privacy` said "Four providers
      # process data on our behalf" and the record, the sub-processor list, the Art. 30 record and
      # SCC Annex III all agreed with it. They agreed because they were copies of each other: the
      # two-way test between the disclosure and the "record" compared it against a hand-typed
      # constant. Two lists omitting the same thing agree perfectly. This reads the SOURCE, which is
      # the one input the lists cannot be a copy of.
      # The home page claimed to read seven platforms and the Worker could read one. The capability
      # gate passed because it checked `IMPLEMENTED_SOURCE_IDS.length > 0` -- that SOMETHING is
      # implemented -- while licensing a claim that named all seven. This checks the thing itself.
      - name: Ingestable guard
        if: ${{ !cancelled() }}
        run: node scripts/check-ingestable.mjs

      - name: Recipient guard
        if: ${{ !cancelled() }}
        run: node scripts/check-recipients.mjs

      # The guard for THIS FILE. A job that asks setup-node for a package-manager cache and never
      # installs has no store to save, and the save step errors rather than skipping -- so the job
      # passes on a cache hit and fails on a miss, which makes it a failure that only ever appears
      # on a dependency bump. See the script header for what it cost.
      - name: Workflow cache guard
        if: ${{ !cancelled() }}
        run: node scripts/check-workflow-cache.mjs

      # `deleteWorkspacePayloads` is written, tested and called by nothing -- which is correct only
      # because `putPayload` is called by nothing either. The day the archive is wired into ingest,
      # closing an account would delete thirteen tables by cascade, report success, and leave the
      # customer's platform data in R2. Nothing else in the build would notice: 19_erasure.sql reads
      # pg_class, and a bucket is not in the catalogue.
      - name: Erasure guard
        if: ${{ !cancelled() }}
        run: node scripts/check-erasure.mjs

      # Two design notes sharing a number has happened four times and never once as a merge
      # conflict: two branches open at the same time, each reading the highest number on main
      # rather than the highest number CLAIMED, and ten filenames sharing five numbers is not
      # something git has an opinion about. It merges clean and ships an ambiguous citation.
      - name: Design-note guard
        if: ${{ !cancelled() }}
        run: node scripts/check-design-notes.mjs

  # Row-level security is the whole tenant-isolation guarantee, so it is a regression gate rather
  # than a one-off check someone once ran. `supabase start` needs Docker-in-Docker and a full
  # Supabase stack; this needs a database, so it runs the real migrations against a plain
  # PostgreSQL 16 service with the shim in supabase/tests/00_supabase_shim.sql.
  #
  # A separate job on purpose: it needs no Node toolchain, and a failure here should read as
  # "isolation broke", not as part of a lint run.
  database:
    name: database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The runner image ships a psql, but not necessarily one matching the server. Pin the client
      # to 16 so a version skew never shows up as a confusing migration failure.
      - name: Install psql 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          psql --version

      # Applies every migration in order, then the RLS suite. The suite exits non-zero if any
      # assertion fails, and it asserts from seven principals -- none of them a superuser, because
      # a superuser bypasses RLS and would make the whole thing pass trivially.
      - name: Migrations and RLS suite
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./supabase/tests/run-local.sh

  # A SEPARATE JOB, AND THE SEPARATION IS THE POINT.
  #
  # `pnpm audit` is the only step in this workflow that depends on a service outside it: it asks the
  # registry what is known about the versions in the lockfile. Run inside `verify`, a registry
  # outage would turn the whole gate red and read exactly like a broken test, and the reflex on a
  # red build is to re-run it rather than to read it. Here it fails on its own, with its own name.
  #
  # It is required all the same. `scripts/check-advisories.mjs` refuses to treat an audit that could
  # not run as a pass, so "we could not check" is a failure rather than a silence -- the same
  # posture as the Worker reporting `not_configured` instead of "nothing to do".
  external:
    name: external
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # NO `cache: pnpm` HERE, AND THE REASON IS THE DEFECT IT CAUSED.
      #
      # This job installs nothing -- see the note below -- so there is no pnpm store for the cache
      # to save. On a cache HIT that is invisible: the restore creates the store directory, and the
      # post-job save finds a path and no-ops. On a cache MISS nothing creates it, the save step
      # reports `Path Validation Error: Path(s) specified in the action for caching do(es) not
      # exist`, and THE JOB FAILS after both guards have already passed.
      #
      # A cache miss is not a rare event here: the key is the lockfile hash, so EVERY dependency
      # bump is a miss by definition. All eight open Dependabot pull requests failed this way at
      # once -- including two that only bump an action version and touch no application code --
      # while `check-advisories` and `check-mailbox` printed their PASS lines in the same log.
      #
      # A cache asked for by a job that installs nothing is a cache that can only cost something.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `pnpm audit` reads the lockfile and needs no node_modules, so nothing is installed here.
      # That also means this job cannot be broken by an install failure, which is the other half of
      # why it is separate.
      - name: Advisory guard
        run: node scripts/check-advisories.mjs

      # The other check that asks the outside world a question, and it belongs in this job for the
      # same reason. `/privacy` publishes a contact address as the statutory rights channel and the
      # zone holds no MX record, so mail to it bounces. `brand.supportMailboxDeliverable` records
      # that and every page reads it; this holds the boolean against the actual zone in BOTH
      # directions, so publishing a working mailbox by flipping a boolean fails, and adding the
      # records without flipping it fails too.
      - name: Mailbox guard
        if: ${{ !cancelled() }}
        run: node scripts/check-mailbox.mjs
